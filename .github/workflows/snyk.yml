name: Snyk Security Scan

# ---------------------------------------------------------------------------
# PHASE MODEL (3 Environments)
# DEV     -> pull_request into main. Fast feedback: SCA + SAST + IaC + Secrets.
# UAT     -> push to the `uat` branch. Full suite: SCA + SAST + Container 
#            (if files changed) + IaC + DAST (ephemeral stack).
# STAGING -> push to the `staging` branch. Gated behind the `staging` 
#            GitHub Environment for final verification & release check.
# ---------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, uat, staging]
  schedule:
    - cron: "0 3 * * 1"   # Weekly Monday scan for newly disclosed CVEs

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ===========================================================================
  # DEV PHASE — PRs into main. Fast static analysis: SCA, SAST, IaC, & Secrets.
  # ===========================================================================
  snyk-sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Install dependencies for all detected ecosystems
        run: |
          find . -name "requirements.txt" -not -path "*/node_modules/*" \
            -execdir sh -c 'pip install -r requirements.txt --break-system-packages --quiet' \; \
            || echo "::warning::one or more pip installs failed"

          find . -name "package.json" -not -path "*/node_modules/*" -maxdepth 3 \
            -execdir npm install --no-audit --no-fund \; \
            || echo "::warning::one or more npm installs failed"

          find . -name "composer.json" -not -path "*/vendor/*" | while read -r manifest; do
            svc_dir=$(dirname "$manifest")
            echo "Patching advisory policy for $manifest"
            cp "$manifest" "$manifest.bak"
            jq '.config += {"audit": {"abandoned": "report"}, "policy": {"advisories": {"block": false}}}' "$manifest" > "$manifest.tmp" \
              && mv "$manifest.tmp" "$manifest"
            (cd "$svc_dir" && composer install --no-interaction --ignore-platform-reqs) \
              || echo "::warning::composer install still failed for $svc_dir"
            mv "$manifest.bak" "$manifest"
          done

          find . -name "*.csproj" \
            -execdir dotnet restore \; \
            || echo "::warning::one or more dotnet restores failed"

      - name: Run Snyk Open Source (SCA)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --all-projects --org=${{ secrets.SNYK_ORG_ID }} --severity-threshold=high --sarif-file-output=snyk-sca-raw.sarif || true

      - name: Deduplicate SCA findings across manifests/projects
        if: always()
        run: |
          if [ -s "snyk-sca-raw.sarif" ]; then
            # Same vulnerability (ruleId) often appears once per manifest
            # (composer.json, php-service/composer.json, requirements.txt,
            # python-service/requirements.txt, direct vs transitive, etc).
            # Merge those into a single result per ruleId, keeping every
            # location so you don't lose "where" info for triage.
            jq '
              .runs[0].results as $results
              | ($results
                  | group_by(.ruleId)
                  | map( (.[0]) + { locations: (map(.locations[]) | unique) } )
                ) as $deduped
              | .runs[0].results = $deduped
            ' snyk-sca-raw.sarif > snyk-sca.sarif
          fi

      - name: Check SCA SARIF output
        if: always()
        id: check_sca
        run: |
          if [ -s "snyk-sca.sarif" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Snyk SCA SARIF to GitHub Security
        if: always() && steps.check_sca.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-sca.sarif
          category: Snyk Open Source

      - name: Evaluate SCA Job Status
        if: always()
        run: |
          if [ -f "snyk-sca.sarif" ]; then
            COUNT=$(jq '[.runs[].results[]? | select(.level == "error")] | length' snyk-sca.sarif 2>/dev/null || echo 0)
            if [ "$COUNT" -gt 0 ]; then
              echo "::error file=snyk-sca.sarif::Snyk SCA scan found $COUNT unique High/Critical vulnerabilities!"
              exit 1
            fi
          fi

  snyk-code-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk Code
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG_ID: ${{ secrets.SNYK_ORG_ID }}
        run: |
          snyk code test --org="$SNYK_ORG_ID" --severity-threshold=high --sarif-file-output=snyk-code.sarif || true

      - name: Check Snyk Code SARIF output
        if: always()
        id: check_snyk_code
        run: |
          if [ -s "snyk-code.sarif" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Code results to GitHub Code Scanning
        if: always() && steps.check_snyk_code.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Evaluate Snyk Code Job Status
        if: always()
        run: |
          if [ -f "snyk-code.sarif" ]; then
            COUNT=$(jq '[.runs[].results[]? | select(.level == "error")] | length' snyk-code.sarif 2>/dev/null || echo 0)
            if [ "$COUNT" -gt 0 ]; then
              echo "::error file=snyk-code.sarif::Snyk Code scan found $COUNT High/Critical vulnerabilities!"
              exit 1
            fi
          fi

  snyk-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk IaC
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG_ID: ${{ secrets.SNYK_ORG_ID }}
        run: |
          npm install -g snyk
          snyk iac test --org="$SNYK_ORG_ID" --report --sarif-file-output=snyk-iac.sarif --severity-threshold=high || true

      - name: Check SARIF output
        if: always()
        id: check_sarif
        run: |
          if [ -s "snyk-iac.sarif" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload IaC results to GitHub Code Scanning
        if: always() && steps.check_sarif.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-iac.sarif
          category: snyk-iac

      - name: Evaluate IaC Job Status
        if: always()
        run: |
          if [ -f "snyk-iac.sarif" ]; then
            COUNT=$(jq '[.runs[].results[]? | select(.level == "error")] | length' snyk-iac.sarif 2>/dev/null || echo 0)
            if [ "$COUNT" -gt 0 ]; then
              echo "::error file=snyk-iac.sarif::Snyk IaC scan found $COUNT High/Critical vulnerabilities!"
              exit 1
            fi
          fi

  # ===========================================================================
  # DYNAMIC CONTAINER DISCOVERY & SCANNING
  # ===========================================================================
  find-dockerfiles:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          FILES=$(find . -type f \( -name "Dockerfile" -o -name "Dockerfile.*" \) | jq -R . | jq -s -c .)
          if [ -z "$FILES" ] || [ "$FILES" == "[]" ]; then
            FILES='["none"]'
          fi
          echo "matrix=$FILES" >> $GITHUB_OUTPUT

  snyk-container:
    needs: find-dockerfiles
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(needs.find-dockerfiles.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Skip if no Dockerfiles found
        if: matrix.dockerfile == 'none'
        run: echo "No Dockerfiles detected in repository. Skipping container scan."

      - name: Extract Service Metadata
        if: matrix.dockerfile != 'none'
        id: meta
        run: |
          SERVICE=$(dirname "${{ matrix.dockerfile }}" | tr '/' '-')
          BASE_IMAGE=$(grep -i '^FROM' "${{ matrix.dockerfile }}" | tail -n 1 | awk '{print $NF}')
          echo "service=$SERVICE" >> $GITHUB_OUTPUT
          echo "base_image=$BASE_IMAGE" >> $GITHUB_OUTPUT

      - name: Scan Container with Snyk
        if: matrix.dockerfile != 'none'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG_ID: ${{ secrets.SNYK_ORG_ID }}
        run: |
          npm install -g snyk snyk-to-sarif

          snyk container test "${{ steps.meta.outputs.base_image }}" \
            --file="${{ matrix.dockerfile }}" \
            --org="$SNYK_ORG_ID" \
            --severity-threshold=high \
            --json-file-output=results.json || true

          if [ -s "results.json" ]; then
            snyk-to-sarif -i results.json -o results-temp.sarif

            jq '
              .runs[].tool.driver.name = "Snyk Container" |
              .runs[].results |= unique_by(.ruleId)
            ' results-temp.sarif > results.sarif
          fi

      # NOTE: no upload-sarif here anymore. Uploading per-Dockerfile under a
      # per-service category is exactly what made the same CVE show up as
      # multiple separate alerts (one per category) in the Security tab.
      # Instead, stash each leg's SARIF as an artifact and merge them all
      # in the job below, before doing a single upload.
      - name: Upload Container SARIF artifact
        if: always() && matrix.dockerfile != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: container-sarif-${{ steps.meta.outputs.service }}
          path: results.sarif
          if-no-files-found: ignore
          retention-days: 1

      - name: Evaluate Container Job Status (per-Dockerfile, fail-fast only)
        if: always() && matrix.dockerfile != 'none'
        run: |
          if [ -f "results.sarif" ]; then
            COUNT=$(jq '[.runs[].results[]? | select(.level == "error")] | length' results.sarif 2>/dev/null || echo 0)
            if [ "$COUNT" -gt 0 ]; then
              echo "::error file=results.sarif::Container scan for ${{ steps.meta.outputs.service }} found $COUNT High/Critical vulnerabilities!"
              exit 1
            fi
          fi

  merge-container-results:
    needs: [find-dockerfiles, snyk-container]
    if: always() && needs.find-dockerfiles.outputs.matrix != '["none"]'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Download all container SARIF artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: container-sarif-*
          path: container-results
          merge-multiple: true

      - name: Merge and dedupe container findings across all Dockerfiles
        run: |
          shopt -s nullglob
          FILES=(container-results/*.sarif)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No container SARIF files to merge."
            exit 0
          fi
          # Combine every Dockerfile's results into one run, then collapse
          # duplicate ruleIds (same CVE, different Dockerfile) into a single
          # result, keeping every location so you can still see which
          # Dockerfiles are affected.
          jq -s '
            {
              "$schema": .[0]["$schema"],
              version: .[0].version,
              runs: [{
                tool: .[0].runs[0].tool,
                results: (
                  [ .[].runs[0].results[]? ]
                  | group_by(.ruleId)
                  | map( (.[0]) + { locations: (map(.locations[]) | unique) } )
                )
              }]
            }
          ' "${FILES[@]}" > merged-container.sarif

      - name: Upload merged Container SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: merged-container.sarif
          category: snyk-container

      - name: Evaluate merged Container Job Status
        if: always()
        run: |
          if [ -f "merged-container.sarif" ]; then
            COUNT=$(jq '[.runs[].results[]? | select(.level == "error")] | length' merged-container.sarif 2>/dev/null || echo 0)
            if [ "$COUNT" -gt 0 ]; then
              echo "::error file=merged-container.sarif::Container scan found $COUNT unique High/Critical vulnerabilities across all Dockerfiles!"
              exit 1
            fi
          fi

  # ===========================================================================
  # UAT PHASE — Heavy scans: DAST live integration
  # ===========================================================================
  snyk-dast:
    if: github.ref_name == 'uat' || github.ref_name == 'staging'
    needs: [snyk-sca, snyk-code-and-secrets, snyk-iac, merge-container-results]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Application Stack via Docker Compose
        run: |
          docker compose up -d --build
          sleep 20

      - name: Start Snyk Scanning Agent
        run: |
          if [ -z "${{ secrets.SNYK_AGENT_TOKEN }}" ]; then
            echo "::error::SNYK_AGENT_TOKEN secret is missing or empty!"
            exit 1
          fi

          NET_NAME=$(docker network ls --filter "label=com.docker.compose.network" -q | head -n 1)
          GATEWAY_IP=$(docker inspect $(docker compose ps -q gateway 2>/dev/null || docker compose ps -q | head -n 1) -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')

          docker run -d \
            --name probely-agent \
            --cap-add NET_ADMIN \
            --device /dev/net/tun \
            ${NET_NAME:+--network "$NET_NAME"} \
            ${GATEWAY_IP:+--add-host gateway:$GATEWAY_IP} \
            -e FARCASTER_AGENT_TOKEN="${{ secrets.SNYK_AGENT_TOKEN }}" \
            -e FARCASTER_API_URL="https://api.au.probely.com" \
            probely/farcaster-onprem-agent:v3 || true

          sleep 30
          docker logs probely-agent --tail 25 || true

      - name: Trigger Snyk/Probely DAST Scan
        id: trigger_scan
        run: |
          if [ -z "${{ secrets.SNYK_TARGET_ID }}" ] || [ -z "${{ secrets.SNYK_DAST_API_KEY }}" ]; then
            echo "::error::SNYK_TARGET_ID or SNYK_DAST_API_KEY secret is missing!"
            exit 1
          fi

          RESPONSE=$(curl -s -L -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://api.au.probely.com/targets/${{ secrets.SNYK_TARGET_ID }}/scan_now/" \
            -H "Authorization: JWT ${{ secrets.SNYK_DAST_API_KEY }}" \
            -H "Content-Type: application/json")

          JSON_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS:.*//g')
          SCAN_ID=$(echo "$JSON_BODY" | jq -r '.id // empty')

          if [ -n "$SCAN_ID" ]; then
            echo "Started Scan ID: $SCAN_ID"
            while true; do
              STATUS_RESP=$(curl -s -L -H "Authorization: JWT ${{ secrets.SNYK_DAST_API_KEY }}" "https://api.au.probely.com/scans/$SCAN_ID/")
              STATUS=$(echo "$STATUS_RESP" | jq -r '.status // empty')
              echo "Current scan status: $STATUS"
              if [ "$STATUS" == "completed" ] || [ "$STATUS" == "finished" ] || [ "$STATUS" == "failed" ] || [ "$STATUS" == "cancelled" ]; then
                break
              fi
              sleep 15
            done
          fi

      - name: Fetch Findings and Convert to SARIF (High and Critical Only)
        if: always()
        run: |
          curl -s "https://api.au.probely.com/targets/${{ secrets.SNYK_TARGET_ID }}/findings/" \
            -H "Authorization: JWT ${{ secrets.SNYK_DAST_API_KEY }}" \
            > raw-findings.json

          jq 'if type == "object" and .results then .results else . end' raw-findings.json > findings.json

          jq '{
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            version: "2.1.0",
            runs: [
              {
                tool: {
                  driver: {
                    name: "Snyk API & Web (DAST)",
                    informationUri: "https://probely.com",
                    rules: [
                      (.[]? | select(.severity == "high" or .severity == "critical") | {
                        id: ((.id // "unknown") | tostring),
                        name: (.definition.name // "Unknown finding"),
                        shortDescription: { text: (.definition.name // "Unknown finding") },
                        fullDescription: { text: (.definition.description // "") },
                        properties: {}
                      })
                    ] | unique_by(.id)
                  }
                },
                results: [
                  (.[]? | select(.severity == "high" or .severity == "critical") | {
                    ruleId: ((.id // "unknown") | tostring),
                    level: "error",
                    message: { text: "Endpoint: \(.url // "N/A")\n\n\((.definition.description // .definition.name // "No description"))" },
                    locations: [
                      {
                        physicalLocation: {
                          artifactLocation: { uri: "docker-compose.yml" }
                        }
                      }
                    ]
                  })
                ]
              }
            ]
          }' findings.json > snyk-dast.sarif

      - name: Check DAST SARIF output
        if: always()
        id: check_dast_sarif
        run: |
          if [ -s "snyk-dast.sarif" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload DAST results to Code Scanning
        if: always() && steps.check_dast_sarif.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-dast.sarif
          category: snyk-dast

      - name: Evaluate DAST Job Status
        if: always()
        run: |
          if [ -f "snyk-dast.sarif" ]; then
            COUNT=$(jq '[.runs[].results[]? | select(.level == "error")] | length' snyk-dast.sarif 2>/dev/null || echo 0)
            if [ "$COUNT" -gt 0 ]; then
              echo "::error file=snyk-dast.sarif::DAST scan found $COUNT High/Critical vulnerabilities!"
              exit 1
            fi
          fi

      - name: Tear Down Stack and Agent
        if: always()
        run: |
          docker stop probely-agent || true
          docker rm probely-agent || true
          docker compose down -v

  # ===========================================================================
  # STAGING PHASE — Protected environment gate for release candidate
  # ===========================================================================
  staging-gate:
    if: github.ref_name == 'staging'
    needs: [snyk-sca, snyk-code-and-secrets, snyk-iac, merge-container-results, snyk-dast]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Staging Gate Check
        run: echo "All security scans completed successfully. Staging environment approval satisfied."
